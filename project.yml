name: WindowSplitter
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
targets:
  WindowSplitter:
    type: application
    platform: macOS
    sources:
      - path: WindowSplitter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.WindowSplitter
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_FILE: WindowSplitter/Info.plist
    entitlements:
      path: WindowSplitter/WindowSplitter.entitlements
      properties:
        com.apple.security.app-sandbox: false
  WindowSplitterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: WindowSplitterTests
    dependencies:
      - target: WindowSplitter
    settings:
      base:
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
